spring.application.name=ping
spring.jpa.database=postgresql

# For local development (Spring Boot on Windows)
#spring.datasource.url=jdbc:postgresql://localhost:5434/wkping
# For Docker (Everything in containers)
spring.datasource.url=jdbc:postgresql://postgres:5432/wkping

spring.datasource.username=postgres
spring.datasource.password=postgres

# For local development (Spring Boot on Windows)
#spring.data.redis.host=localhost
# For Docker (Everything in containers)
spring.data.redis.host=redis
spring.data.redis.port=6379

# For local development
#front_end_url=http://localhost:3000
# For Docker
front_end_url=http://${IP_ADDRESS}
